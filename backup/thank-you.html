<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ďakujem | Štefan Dubnička</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <style>
        .thank-you-container {
            text-align: center;
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
        }
        
        .thank-you-icon {
            font-size: 60px;
            color: #27ae60;
            margin-bottom: 20px;
        }
        
        .thank-you-title {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .thank-you-message {
            margin-bottom: 30px;
            color: #555;
        }
        
        .back-button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #3498db;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .back-button:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <div class="thank-you-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1 class="thank-you-title">Správa odoslaná!</h1>
        <p class="thank-you-message">Ďakujem za Vašu správu. Budem Vás kontaktovať čo najskôr.</p>
        <a href="index.html" class="back-button">
            <i class="fas fa-arrow-left"></i> Späť na domovskú stránku
        </a>
    </div>
</body>
</html>
